name: Version Check

on:
  pull_request:
    branches:
      - main

jobs:
  verify-version-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633 # v4.1.2
        with:
          path: pr

      - name: Check out main
        uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633 # v4.1.2
        with:
          ref: main
          path: base

      - name: Verify Chart.yaml, appVersion, and package.json are all bumped and in sync
        run: |
          set -euo pipefail

          extract_chart_version() { sed -n 's/^version:[[:space:]]*//p' "$1" | tr -d '"' | head -n1; }
          extract_app_version()   { sed -n 's/^appVersion:[[:space:]]*//p' "$1" | tr -d '"' | head -n1; }
          extract_pkg_version()   { node -e "process.stdout.write(require('$1').version)"; }

          PR_CHART=$(extract_chart_version pr/charts/pacman/Chart.yaml)
          PR_APP=$(extract_app_version pr/charts/pacman/Chart.yaml)
          PR_PKG=$(extract_pkg_version ./pr/package.json)
          BASE_CHART=$(extract_chart_version base/charts/pacman/Chart.yaml)

          echo "PR     chart version     = $PR_CHART"
          echo "PR     chart appVersion  = $PR_APP"
          echo "PR     package.json ver  = $PR_PKG"
          echo "main   chart version     = $BASE_CHART"

          if [ "$PR_CHART" != "$PR_APP" ] || [ "$PR_CHART" != "$PR_PKG" ]; then
            echo "::error::version ($PR_CHART), appVersion ($PR_APP), and package.json version ($PR_PKG) must match"
            exit 1
          fi

          # Compare PR_CHART > BASE_CHART using sort -V
          if [ "$PR_CHART" = "$BASE_CHART" ]; then
            echo "::error::Version not bumped. Current main is $BASE_CHART, PR is still $PR_CHART."
            echo "::error::Bump charts/pacman/Chart.yaml version + appVersion and package.json version in sync."
            exit 1
          fi
          HIGHER=$(printf '%s\n%s\n' "$PR_CHART" "$BASE_CHART" | sort -V | tail -n1)
          if [ "$HIGHER" != "$PR_CHART" ]; then
            echo "::error::PR version ($PR_CHART) is not greater than main's ($BASE_CHART)."
            exit 1
          fi

          echo "Version bump OK: $BASE_CHART -> $PR_CHART"
